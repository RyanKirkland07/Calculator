<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link href="style.css" rel="stylesheet">
</head>
<body class="flex">
    <div id="display">
        <p id="display-error"></p>
        <p id="display-num-1"></p>
        <p id="display-operator"></p>
        <p id="display-num-2"></p>
    </div>
    <div id="buttons" class="flex">
        <div id="digits" class="flex">
            <button id="0" class="digit" value="0" onclick="updateNumber(event)"> 0 </button>
            <button id="1" class="digit" value="1" onclick="updateNumber(event)"> 1 </button>
            <button id="2" class="digit" value="2" onclick="updateNumber(event)"> 2 </button>
            <button id="3" class="digit" value="3" onclick="updateNumber(event)"> 3 </button>
            <button id="4" class="digit" value="4" onclick="updateNumber(event)"> 4 </button>
            <button id="5" class="digit" value="5" onclick="updateNumber(event)"> 5 </button>
            <button id="6" class="digit" value="6" onclick="updateNumber(event)"> 6 </button>
            <button id="7" class="digit" value="7" onclick="updateNumber(event)"> 7 </button>
            <button id="8" class="digit" value="8" onclick="updateNumber(event)"> 8 </button>
            <button id="9" class="digit" value="9" onclick="updateNumber(event)"> 9 </button>
        </div>
        <div id="operators" class="flex">
            <button id="+" class="operator" value="+" onclick="updateOperator(event)"> + </button>
            <button id="-" class="operator" value="-" onclick="updateOperator(event)"> - </button>
            <button id="*" class="operator" value="*" onclick="updateOperator(event)"> * </button>
            <button id="/" class="operator" value="/" onclick="updateOperator(event)"> / </button>
            <button id="=" class="operator" value="=" onclick="equate()"> = </button>
        </div>
    </div>

    <script src="calc.js"></script>
</body>
</html>
